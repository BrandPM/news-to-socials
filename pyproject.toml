[project]
name = "news-to-socials"
version = "0.0.1"
description = "Automated news-to-social-media pipeline for 5 fintech brands (Icon, Neovox, Creolix, Vilatrix, Nexora)"
authors = [{ name = "Andriy Braslavskyi", email = "andriy@icon.finance" }]
license = { text = "MIT" }
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # HTTP / parsing
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    # NTS_101 §4 — text extraction from primary documents. Pure Python, no
    # system libraries, which matters because the extractor runs on the VPS
    # under a hardened systemd unit with ProtectSystem=strict.
    "pypdf>=5.0.0",
    # NTS_112 — SVG → PNG for the data covers. Ships a static rust binary, so
    # there is nothing to install on the VPS beyond the wheel.
    "resvg-py>=0.1.5",
    "python-slugify>=8.0.4",

    # Data / validation
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",

    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",

    # LLM / embeddings
    "openai>=1.40.0",

    # Image generation / processing
    "replicate>=0.32.0",
    "Pillow>=10.3.0",

    # Telegram
    "python-telegram-bot[ext]>=21.0",

    # Scheduling
    "apscheduler>=3.10.4",

    # Observability
    "structlog>=24.1.0",

    # Retries
    "tenacity>=8.5.0",

    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",

    # Encryption — Fernet symmetric (AES-128-CBC + HMAC-SHA256). Used by
    # pipeline.admin.encryption to encrypt per-brand Sanity/Telegram/Meta
    # tokens at rest in admin.db. Master key BRANDS_ENCRYPTION_KEY lives
    # in .env on Mac + VPS. NTS_025 § "Credential encryption".
    "cryptography>=42",
]

[project.optional-dependencies]
ml = [
    # For W4 hybrid dedup (Stage 6)
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "sentence-transformers>=3.0.0",
    # Optional advanced clustering (inspired by meridian's UMAP+HDBSCAN approach)
    "umap-learn>=0.5.6",
    "hdbscan>=0.8.36",
]
api = [
    # For optional FastAPI health endpoint (Stage 7)
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30.0",
]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",        # httpx mocks
    "freezegun>=1.5.0",     # time mocks
    "pre-commit>=3.7.0",
]

[project.scripts]
nts = "pipeline.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false  # tighten later

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
